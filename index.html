<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Akifio - Dijital Araçlar</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ================================
           TÜRK BAYRAĞI ALANI
        ================================= */

        .turkey-banner {
            flex: 1;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: flex-end;

            gap: 22px;
            padding: 0 35px 0 25px;

            overflow: hidden;
        }


        .turkey-flag-image {
            width: 560px;
            max-width: 58%;
            height: auto;

            display: block;
            object-fit: contain;

            user-select: none;
            pointer-events: none;

            animation: flagFloat 6s ease-in-out infinite;
        }


        @keyframes flagFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(2px);
            }

        }


        /* ================================
           YAZI
        ================================= */

        .turkey-text {
            position: relative;

            display: flex;
            flex-direction: column;
            align-items: flex-start;

            white-space: nowrap;

            line-height: 1.15;

            color: #4b5563;
            font-size: 15px;
            font-weight: 500;
        }


        .turkey-text strong {
            margin-top: 5px;

            color: #e30a17;

            font-size: 25px;
            font-weight: 800;

            letter-spacing: -0.3px;
        }


        .turkey-text .star {
            position: absolute;

            right: -32px;
            bottom: 1px;

            color: #e30a17;

            font-size: 23px;
            line-height: 1;

            animation: starPulse 3s ease-in-out infinite;
        }


        @keyframes starPulse {

            0%,
            100% {
                opacity: .75;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.08);
            }

        }


        /* ================================
           TABLET
        ================================= */

        @media (max-width: 1000px) {

            .turkey-banner {
                gap: 15px;
                padding-right: 20px;
            }


            .turkey-flag-image {
                width: 430px;
                max-width: 52%;
            }


            .turkey-text strong {
                font-size: 21px;
            }

        }


        /* ================================
           MOBİL
        ================================= */

        @media (max-width: 700px) {

            .topbar {
                min-height: 125px;
                height: auto;

                display: flex;
                flex-direction: column;

                align-items: stretch;

                gap: 12px;

                padding: 12px 15px;
            }


            .topbar .search {
                width: 100%;
                max-width: 100%;

                flex-shrink: 0;
            }


            .turkey-banner {
                display: flex;

                width: 100%;
                height: 75px;

                flex: none;

                align-items: center;
                justify-content: center;

                gap: 12px;

                padding: 0;

                overflow: hidden;
            }


            .turkey-flag-image {
                width: 210px;
                max-width: 65%;

                height: auto;

                display: block;

                object-fit: contain;
            }


            .turkey-text {
                font-size: 11px;
            }


            .turkey-text strong {
                font-size: 17px;
                margin-top: 3px;
            }


            .turkey-text .star {
                right: -18px;
                bottom: 0;

                font-size: 16px;
            }

        }


        /* ================================
           ÇOK KÜÇÜK TELEFONLAR
        ================================= */

        @media (max-width: 400px) {

            .topbar {
                min-height: 115px;
                padding: 10px 12px;
            }


            .turkey-banner {
                height: 65px;

                gap: 8px;
            }


            .turkey-flag-image {
                width: 170px;
                max-width: 60%;
            }


            .turkey-text {
                font-size: 10px;
            }


            .turkey-text strong {
                font-size: 15px;
            }


            .turkey-text .star {
                right: -15px;
                font-size: 14px;
            }

        }

    </style>
</head>


<body>


    <!-- =========================================
         SOL MENÜ
    ========================================= -->

    <aside class="sidebar">

        <a href="index.html" class="logo">
            Akif<span>io</span>
        </a>


        <div class="menu-title">
            ANA MENÜ
        </div>


        <a href="index.html" class="menu-link active">

            <span class="menu-icon">
                ⌂
            </span>

            Ana Sayfa

        </a>


        <!-- Menü JavaScript tarafından doldurulacak -->

        <div id="sidebar-menu"></div>

    </aside>



    <!-- =========================================
         ANA ALAN
    ========================================= -->

    <div class="main">


        <!-- =====================================
             ÜST BAR
        ===================================== -->

        <header class="topbar">


            <!-- ARAÇ ARAMA -->

            <input
                type="search"
                id="tool-search"
                class="search"
                placeholder="Araç ara..."
                autocomplete="off"
            >


            <!-- =================================
                 TÜRK BAYRAĞI
            ================================== -->

            <div class="turkey-banner">


                <img
                    src="turk-bayragi.png"
                    alt="Türk bayrağı"
                    class="turkey-flag-image"
                >


                <div class="turkey-text">

                    <span>
                        Rengi belli,
                    </span>

                    <strong>
                        adresi belli.
                    </strong>

                    <span class="star">
                        ✦
                    </span>

                </div>


            </div>

        </header>



        <!-- =====================================
             İÇERİK
        ===================================== -->

        <main class="content">


            <section class="hero">


                <h1>

                    Dijital işlerini

                    <span>
                        kolaylaştır.
                    </span>

                </h1>


                <p>

                    İhtiyacın olan tüm dijital araçlar
                    tek bir yerde. Hızlı, basit ve ücretsiz.

                </p>


            </section>



            <!-- Araçlar JavaScript ile gelecek -->

            <div id="tools-container"></div>


        </main>



        <!-- =====================================
             FOOTER
        ===================================== -->

        <footer class="footer">

            © 2026 Akifio

        </footer>


    </div>



    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script src="js/tools.js"></script>

    <script src="js/main.js"></script>


</body>
</html>
