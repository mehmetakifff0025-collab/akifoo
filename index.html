    <style>
        /* =====================================================
           AKIFIO - TÜRK BAYRAĞI DEKORASYONU
           Sadece ana sayfadaki üst alan için
        ===================================================== */

        .hero {
            position: relative;
            overflow: visible;
        }

        .turkey-decoration {
            position: absolute;

            top: -65px;
            right: 10px;

            width: min(650px, 58%);
            height: 145px;

            pointer-events: none;

            z-index: 1;
        }

        .turkey-decoration svg {
            width: 100%;
            height: 100%;

            overflow: visible;

            display: block;
        }

        /* Bayrağın yavaş kumaş hareketi */

        .flag-ribbon {
            transform-origin: 50% 50%;

            animation: flagMotion 5.5s ease-in-out infinite;
        }

        @keyframes flagMotion {

            0%,
            100% {
                transform:
                    translateY(0px)
                    scaleY(1);
            }

            25% {
                transform:
                    translateY(-3px)
                    scaleY(0.98);
            }

            50% {
                transform:
                    translateY(2px)
                    scaleY(1.02);
            }

            75% {
                transform:
                    translateY(-2px)
                    scaleY(0.99);
            }
        }

        /* İnce kumaş çizgileri */

        .flag-wave-lines {
            opacity: 0.32;

            animation:
                waveLines 6s ease-in-out infinite;
        }

        @keyframes waveLines {

            0%,
            100% {
                transform: translateX(0);
                opacity: 0.28;
            }

            50% {
                transform: translateX(8px);
                opacity: 0.42;
            }
        }

        /* Küçük kırmızı parçacıklar */

        .flag-particles {
            animation:
                particlesFloat 5s ease-in-out infinite;
        }

        @keyframes particlesFloat {

            0%,
            100% {
                opacity: 0.45;
                transform: translateY(0);
            }

            50% {
                opacity: 0.8;
                transform: translateY(-5px);
            }
        }

        /* Sağdaki Türkiye yazısı */

        .turkey-label {
            position: absolute;

            right: 0;
            top: 72px;

            display: flex;
            flex-direction: column;

            align-items: flex-start;

            line-height: 1.15;

            font-size: 15px;

            color: #4b5563;

            white-space: nowrap;
        }

        .turkey-label strong {
            margin-top: 4px;

            color: #e30a17;

            font-size: 25px;

            font-weight: 800;
        }

        .turkey-label .little-star {
            position: absolute;

            right: -27px;
            top: 28px;

            color: #e30a17;

            font-size: 24px;

            animation: starPulse 3s ease-in-out infinite;
        }

        @keyframes starPulse {

            0%,
            100% {
                opacity: 0.75;
                transform: scale(1) rotate(0deg);
            }

            50% {
                opacity: 1;
                transform: scale(1.08) rotate(45deg);
            }
        }


        /* =====================================================
           MOBİL
        ===================================================== */

        @media (max-width: 900px) {

            .turkey-decoration {
                width: 500px;
                right: -30px;
            }

            .turkey-label {
                right: 15px;
            }
        }

        @media (max-width: 700px) {

            .turkey-decoration {
                position: relative;

                top: auto;
                right: auto;

                width: 100%;
                height: 100px;

                margin-top: 20px;
            }

            .turkey-label {
                display: none;
            }
        }
    </style>
