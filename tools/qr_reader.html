<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Kod Oku - Akifio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f8fc;
            color: #111827;
        }

        .container {
            width: min(850px, calc(100% - 32px));
            margin: 50px auto;
        }

        .back {
            display: inline-block;
            margin-bottom: 24px;
            color: #5b5cf0;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            text-decoration: underline;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(17, 24, 39, 0.06);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        .description {
            margin: 0 0 28px;
            color: #6b7280;
            line-height: 1.6;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .option {
            padding: 24px;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            background: #ffffff;
        }

        .option h2 {
            margin: 0 0 8px;
            font-size: 18px;
        }

        .option p {
            margin: 0 0 18px;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
        }

        .button {
            display: inline-block;
            width: 100%;
            padding: 13px 18px;
            border: 0;
            border-radius: 10px;
            background: #5b5cf0;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
        }

        .button:hover {
            background: #494ad8;
        }

        input[type="file"] {
            display: none;
        }

        .camera {
            display: none;
            margin-top: 25px;
        }

        video {
            display: block;
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            border-radius: 14px;
            background: #111827;
        }

        .camera-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .secondary {
            background: #111827;
        }

        .secondary:hover {
            background: #1f2937;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 14px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
        }

        .result-title {
            margin: 0 0 10px;
            font-size: 17px;
        }

        .result-text {
            margin: 0;
            padding: 14px;
            background: #ffffff;
            border: 1px solid #dcfce7;
            border-radius: 10px;
            word-break: break-word;
            line-height: 1.5;
        }

        .copy-button {
            margin-top: 12px;
            width: auto;
            padding: 10px 16px;
        }

        .error {
            display: none;
            margin-top: 20px;
            padding: 12px 15px;
            border-radius: 10px;
            background: #fef2f2;
            color: #b91c1c;
            font-size: 14px;
        }

        .status {
            margin-top: 15px;
            color: #6b7280;
            font-size: 14px;
            text-align: center;
        }

        canvas {
            display: none;
        }

        @media (max-width: 650px) {
            .container {
                margin: 25px auto;
            }

            .card {
                padding: 22px;
            }

            h1 {
                font-size: 27px;
            }

            .options {
                grid-template-columns: 1fr;
            }

            .camera-controls {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <a href="../index.html" class="back">
            ← Akifio ana sayfa
        </a>

        <div class="card">

            <h1>QR Kod Oku</h1>

            <p class="description">
                QR kodunu kameranla okut veya cihazından bir QR görseli yükle.
            </p>

            <div class="options">

                <div class="option">

                    <h2>📷 Kamerayla Oku</h2>

                    <p>
                        Kameranı kullanarak QR kodunu anında tara.
                    </p>

                    <button
                        type="button"
                        class="button"
                        id="cameraButton"
                    >
                        Kamerayı Aç
                    </button>

                </div>

                <div class="option">

                    <h2>🖼️ Görselden Oku</h2>

                    <p>
                        Cihazındaki QR kod görselini seç.
                    </p>

                    <label
                        for="fileInput"
                        class="button"
                    >
                        Görsel Seç
                    </label>

                    <input
                        id="fileInput"
                        type="file"
                        accept="image/*"
                    >

                </div>

            </div>

            <div
                class="camera"
                id="cameraContainer"
            >

                <video
                    id="video"
                    autoplay
                    playsinline
                ></video>

                <div class="camera-controls">

                    <button
                        type="button"
                        class="button secondary"
                        id="stopCameraButton"
                    >
                        Kamerayı Kapat
                    </button>

                </div>

                <p
                    class="status"
                    id="cameraStatus"
                >
                    QR kod aranıyor...
                </p>

            </div>

            <canvas id="canvas"></canvas>

            <div
                class="result"
                id="result"
            >

                <h2 class="result-title">
                    QR Kodu Bulundu
                </h2>

                <p
                    class="result-text"
                    id="resultText"
                ></p>

                <button
                    type="button"
                    class="button copy-button"
                    id="copyButton"
                >
                    Sonucu Kopyala
                </button>

            </div>

            <div
                class="error"
                id="error"
            ></div>

        </div>

    </div>

    <script>
        const fileInput =
            document.getElementById("fileInput");

        const cameraButton =
            document.getElementById("cameraButton");

        const stopCameraButton =
            document.getElementById("stopCameraButton");

        const cameraContainer =
            document.getElementById("cameraContainer");

        const video =
            document.getElementById("video");

        const canvas =
            document.getElementById("canvas");

        const cameraStatus =
            document.getElementById("cameraStatus");

        const result =
            document.getElementById("result");

        const resultText =
            document.getElementById("resultText");

        const copyButton =
            document.getElementById("copyButton");

        const errorBox =
            document.getElementById("error");


        let stream = null;
        let scanning = false;


        function showError(message) {
            errorBox.textContent = message;
            errorBox.style.display = "block";
        }


        function hideError() {
            errorBox.textContent = "";
            errorBox.style.display = "none";
        }


        function showResult(text) {

            resultText.textContent = text;
            result.style.display = "block";

            stopCamera();

        }


        function stopCamera() {

            scanning = false;

            if (stream) {

                stream.getTracks().forEach(
                    track => track.stop()
                );

                stream = null;
            }

            video.srcObject = null;

            cameraContainer.style.display = "none";

            cameraButton.textContent =
                "Kamerayı Aç";
        }


        async function startCamera() {

            hideError();

            if (
                !navigator.mediaDevices ||
                !navigator.mediaDevices.getUserMedia
            ) {

                showError(
                    "Tarayıcın kamera erişimini desteklemiyor."
                );

                return;
            }


            try {

                stream =
                    await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: {
                                ideal: "environment"
                            }
                        },
                        audio: false
                    });


                video.srcObject = stream;

                cameraContainer.style.display =
                    "block";

                scanning = true;

                cameraStatus.textContent =
                    "QR kod aranıyor...";

                await video.play();

                scanCamera();

            } catch (error) {

                showError(
                    "Kameraya erişilemedi. Tarayıcı ayarlarından kamera iznini kontrol et."
                );

            }

        }


        function scanCamera() {

            if (!scanning) {
                return;
            }


            if (
                video.readyState <
                HTMLMediaElement.HAVE_ENOUGH_DATA
            ) {

                requestAnimationFrame(
                    scanCamera
                );

                return;
            }


            const width =
                video.videoWidth;

            const height =
                video.videoHeight;


            if (!width || !height) {

                requestAnimationFrame(
                    scanCamera
                );

                return;
            }


            canvas.width = width;
            canvas.height = height;


            const context =
                canvas.getContext("2d", {
                    willReadFrequently: true
                });


            context.drawImage(
                video,
                0,
                0,
                width,
                height
            );


            const imageData =
                context.getImageData(
                    0,
                    0,
                    width,
                    height
                );


            if (
                "BarcodeDetector" in window
            ) {

                const detector =
                    new BarcodeDetector({
                        formats: ["qr_code"]
                    });


                detector.detect(
                    canvas
                )
                .then(codes => {

                    if (
                        codes.length > 0 &&
                        codes[0].rawValue
                    ) {

                        showResult(
                            codes[0].rawValue
                        );

                        return;
                    }

                    requestAnimationFrame(
                        scanCamera
                    );

                })
                .catch(() => {

                    requestAnimationFrame(
                        scanCamera
                    );

                });

            } else {

                cameraStatus.textContent =
                    "Bu tarayıcı QR taramasını desteklemiyor.";

                scanning = false;
            }

        }


        cameraButton.addEventListener(
            "click",
            () => {

                if (stream) {
                    return;
                }

                startCamera();

            }
        );


        stopCameraButton.addEventListener(
            "click",
            () => {
                stopCamera();
            }
        );


        fileInput.addEventListener(
            "change",
            async () => {

                hideError();

                const file =
                    fileInput.files[0];

                if (!file) {
                    return;
                }


                if (
                    !file.type.startsWith("image/")
                ) {

                    showError(
                        "Lütfen geçerli bir görsel seç."
                    );

                    fileInput.value = "";

                    return;
                }


                try {

                    const image =
                        new Image();

                    const imageUrl =
                        URL.createObjectURL(file);


                    image.onload = async () => {

                        try {

                            canvas.width =
                                image.naturalWidth;

                            canvas.height =
                                image.naturalHeight;


                            const context =
                                canvas.getContext(
                                    "2d",
                                    {
                                        willReadFrequently: true
                                    }
                                );


                            context.drawImage(
                                image,
                                0,
                                0
                            );


                            if (
                                "BarcodeDetector" in window
                            ) {

                                const detector =
                                    new BarcodeDetector({
                                        formats: [
                                            "qr_code"
                                        ]
                                    });


                                const codes =
                                    await detector.detect(
                                        canvas
                                    );


                                if (
                                    codes.length > 0 &&
                                    codes[0].rawValue
                                ) {

                                    showResult(
                                        codes[0].rawValue
                                    );

                                } else {

                                    showError(
                                        "Görselde QR kod bulunamadı."
                                    );

                                }

                            } else {

                                showError(
                                    "Bu tarayıcı görselden QR okumayı desteklemiyor."
                                );

                            }

                        } catch (error) {

                            showError(
                                "QR kod okunurken bir hata oluştu."
                            );

                        } finally {

                            URL.revokeObjectURL(
                                imageUrl
                            );

                        }

                    };


                    image.onerror = () => {

                        URL.revokeObjectURL(
                            imageUrl
                        );

                        showError(
                            "Görsel okunamadı."
                        );

                    };


                    image.src = imageUrl;

                } catch (error) {

                    showError(
                        "Görsel işlenemedi."
                    );

                }

            }
        );


        copyButton.addEventListener(
            "click",
            async () => {

                const text =
                    resultText.textContent;

                if (!text) {
                    return;
                }


                try {

                    await navigator.clipboard.writeText(
                        text
                    );

                    copyButton.textContent =
                        "Kopyalandı ✓";


                    setTimeout(() => {

                        copyButton.textContent =
                            "Sonucu Kopyala";

                    }, 1500);

                } catch (error) {

                    showError(
                        "Sonuç kopyalanamadı."
                    );

                }

            }
        );


        window.addEventListener(
            "beforeunload",
            () => {
                stopCamera();
            }
        );
    </script>

</body>
</html>
