```html
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Kod Oluştur — Akifio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f8fc;
            color: #111827;
        }

        header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 20px;
        }

        .header {
            max-width: 900px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #5b5cf0;
        }

        .back {
            text-decoration: none;
            color: #6b7280;
        }

        main {
            max-width: 800px;
            margin: auto;
            padding: 70px 20px;
        }

        h1 {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            resize: vertical;
            padding: 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-family: Arial, sans-serif;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #5b5cf0;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4748d8;
        }

        #result {
            margin-top: 30px;
            text-align: center;
        }

        #qr {
            margin: 20px auto;
            width: 220px;
            min-height: 20px;
        }

        #download {
            display: none;
            text-decoration: none;
            background: #111827;
            color: white;
            padding: 11px 18px;
            border-radius: 8px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }
    </style>
</head>

<body>

<header>

    <div class="header">

        <a href="../index.html" class="logo">
            Akif<span>io</span>
        </a>

        <a href="../index.html" class="back">
            ← Ana Sayfa
        </a>

    </div>

</header>


<main>

    <h1>QR Kod Oluşturucu</h1>

    <p class="subtitle">
        Metin veya bağlantını QR koduna dönüştür.
    </p>

    <div class="card">

        <label for="text">
            Metin veya bağlantı
        </label>

        <textarea
            id="text"
            placeholder="https://akifio.com"
        ></textarea>

        <button onclick="createQR()">
            QR Kod Oluştur
        </button>

        <div id="result">

            <div id="qr"></div>

            <a id="download" download="akifio-qr.png">
                QR Kodunu İndir
            </a>

        </div>

    </div>

</main>


<footer>
    © 2026 Akifio
</footer>


<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>

function createQR() {

    const text = document.getElementById("text").value.trim();
    const qr = document.getElementById("qr");
    const download = document.getElementById("download");

    qr.innerHTML = "";
    download.style.display = "none";

    if (!text) {
        alert("Lütfen bir metin veya bağlantı gir.");
        return;
    }

    new QRCode(qr, {
        text: text,
        width: 220,
        height: 220,
        correctLevel: QRCode.CorrectLevel.H
    });

    setTimeout(function() {

        const canvas = qr.querySelector("canvas");

        if (canvas) {
            download.href = canvas.toDataURL("image/png");
            download.style.display = "inline-block";
        }

    }, 200);
}

</script>

</body>
</html>
