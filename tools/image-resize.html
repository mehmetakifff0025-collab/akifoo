<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Görsel Boyutlandır - Akifio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f8fc;
            color: #111827;
        }

        .container {
            width: min(900px, calc(100% - 32px));
            margin: 50px auto;
        }

        .back {
            display: inline-block;
            margin-bottom: 24px;
            color: #5b5cf0;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            text-decoration: underline;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(17, 24, 39, 0.06);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        .description {
            margin: 0 0 28px;
            color: #6b7280;
            line-height: 1.6;
        }

        .upload {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 180px;
            padding: 25px;
            border: 2px dashed #d1d5db;
            border-radius: 14px;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }

        .upload:hover {
            border-color: #5b5cf0;
            background: #f8f8ff;
        }

        .upload strong {
            display: block;
            margin-bottom: 8px;
            font-size: 17px;
        }

        .upload span {
            color: #6b7280;
            font-size: 14px;
        }

        #fileInput {
            display: none;
        }

        .preview {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
        }

        .preview img {
            display: block;
            max-width: 100%;
            max-height: 350px;
            margin: 0 auto;
            border-radius: 10px;
        }

        .dimensions {
            display: none;
            margin-top: 25px;
        }

        .dimensions-title {
            margin: 0 0 18px;
            font-size: 18px;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .field input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        .field input:focus {
            border-color: #5b5cf0;
        }

        .original {
            margin-bottom: 18px;
            color: #6b7280;
            font-size: 14px;
        }

        .ratio {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
            font-size: 14px;
        }

        .ratio input {
            width: 17px;
            height: 17px;
            cursor: pointer;
        }

        .button {
            width: 100%;
            padding: 14px 20px;
            border: 0;
            border-radius: 10px;
            background: #5b5cf0;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .button:hover {
            background: #494ad8;
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 18px;
            border-radius: 12px;
            background: #f3f4f6;
        }

        .result p {
            margin: 6px 0;
            font-size: 14px;
        }

        .download {
            display: block;
            margin-top: 15px;
            padding: 13px 20px;
            border-radius: 10px;
            background: #111827;
            color: #ffffff;
            text-align: center;
            text-decoration: none;
            font-weight: 600;
        }

        .download:hover {
            background: #1f2937;
        }

        .error {
            display: none;
            margin-top: 20px;
            padding: 12px 15px;
            border-radius: 10px;
            background: #fef2f2;
            color: #b91c1c;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 25px auto;
            }

            .card {
                padding: 22px;
            }

            h1 {
                font-size: 27px;
            }

            .input-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <a href="../index.html" class="back">
            ← Akifio ana sayfa
        </a>

        <div class="card">

            <h1>Görsel Boyutlandır</h1>

            <p class="description">
                Görselinin genişliğini ve yüksekliğini kolayca değiştir.
                İşlem tarayıcında gerçekleşir.
            </p>

            <label class="upload" for="fileInput">
                <div>
                    <strong>Görsel seç</strong>
                    <span>JPG, PNG veya WebP dosyanı yükle</span>
                </div>
            </label>

            <input
                id="fileInput"
                type="file"
                accept="image/jpeg,image/png,image/webp"
            >

            <div class="preview" id="preview">
                <img
                    id="previewImage"
                    alt="Görsel önizleme"
                >
            </div>

            <div class="dimensions" id="dimensions">

                <h2 class="dimensions-title">
                    Yeni boyut
                </h2>

                <div class="original">
                    Orijinal boyut:
                    <strong id="originalDimensions">
                        -
                    </strong>
                </div>

                <div class="input-row">

                    <div class="field">
                        <label for="width">
                            Genişlik (px)
                        </label>

                        <input
                            id="width"
                            type="number"
                            min="1"
                            step="1"
                        >
                    </div>

                    <div class="field">
                        <label for="height">
                            Yükseklik (px)
                        </label>

                        <input
                            id="height"
                            type="number"
                            min="1"
                            step="1"
                        >
                    </div>

                </div>

                <label class="ratio">
                    <input
                        id="keepRatio"
                        type="checkbox"
                        checked
                    >

                    <span>
                        En-boy oranını koru
                    </span>
                </label>

                <button
                    type="button"
                    class="button"
                    id="resizeButton"
                >
                    Görseli Boyutlandır
                </button>

            </div>

            <div class="result" id="result">

                <p>
                    <strong>Orijinal boyut:</strong>
                    <span id="resultOriginal"></span>
                </p>

                <p>
                    <strong>Yeni boyut:</strong>
                    <span id="resultNew"></span>
                </p>

                <a
                    id="downloadButton"
                    class="download"
                    download="akifio-boyutlandirilmis.jpg"
                >
                    Boyutlandırılmış Görseli İndir
                </a>

            </div>

            <div
                class="error"
                id="error"
            ></div>

        </div>

    </div>

    <script>
        const fileInput = document.getElementById("fileInput");

        const preview = document.getElementById("preview");
        const previewImage = document.getElementById("previewImage");

        const dimensions = document.getElementById("dimensions");

        const originalDimensions =
            document.getElementById("originalDimensions");

        const widthInput =
            document.getElementById("width");

        const heightInput =
            document.getElementById("height");

        const keepRatio =
            document.getElementById("keepRatio");

        const resizeButton =
            document.getElementById("resizeButton");

        const result =
            document.getElementById("result");

        const resultOriginal =
            document.getElementById("resultOriginal");

        const resultNew =
            document.getElementById("resultNew");

        const downloadButton =
            document.getElementById("downloadButton");

        const errorBox =
            document.getElementById("error");


        let selectedFile = null;

        let originalWidth = 0;
        let originalHeight = 0;

        let previewUrl = null;
        let downloadUrl = null;


        function showError(message) {
            errorBox.textContent = message;
            errorBox.style.display = "block";
        }


        function hideError() {
            errorBox.textContent = "";
            errorBox.style.display = "none";
        }


        function clearDownloadUrl() {
            if (downloadUrl) {
                URL.revokeObjectURL(downloadUrl);
                downloadUrl = null;
            }
        }


        fileInput.addEventListener("change", () => {

            hideError();

            const file = fileInput.files[0];

            if (!file) {
                return;
            }


            if (!file.type.startsWith("image/")) {

                showError(
                    "Lütfen geçerli bir JPG, PNG veya WebP dosyası seç."
                );

                fileInput.value = "";
                return;
            }


            selectedFile = file;


            if (previewUrl) {
                URL.revokeObjectURL(previewUrl);
            }


            previewUrl = URL.createObjectURL(file);

            previewImage.src = previewUrl;


            previewImage.onload = () => {

                originalWidth = previewImage.naturalWidth;
                originalHeight = previewImage.naturalHeight;


                originalDimensions.textContent =
                    `${originalWidth} × ${originalHeight} px`;


                widthInput.value = originalWidth;
                heightInput.value = originalHeight;


                preview.style.display = "block";
                dimensions.style.display = "block";

                result.style.display = "none";

                clearDownloadUrl();
            };


            previewImage.onerror = () => {

                showError(
                    "Görsel okunamadı. Lütfen başka bir dosya dene."
                );

                preview.style.display = "none";
                dimensions.style.display = "none";
            };

        });


        widthInput.addEventListener("input", () => {

            if (!keepRatio.checked) {
                return;
            }

            if (
                originalWidth <= 0 ||
                originalHeight <= 0
            ) {
                return;
            }

            const newWidth = Number(widthInput.value);

            if (!Number.isFinite(newWidth) || newWidth <= 0) {
                return;
            }

            const ratio =
                originalHeight / originalWidth;

            const newHeight =
                Math.round(newWidth * ratio);

            heightInput.value = newHeight;
        });


        heightInput.addEventListener("input", () => {

            if (!keepRatio.checked) {
                return;
            }

            if (
                originalWidth <= 0 ||
                originalHeight <= 0
            ) {
                return;
            }

            const newHeight = Number(heightInput.value);

            if (!Number.isFinite(newHeight) || newHeight <= 0) {
                return;
            }

            const ratio =
                originalWidth / originalHeight;

            const newWidth =
                Math.round(newHeight * ratio);

            widthInput.value = newWidth;
        });


        resizeButton.addEventListener("click", () => {

            hideError();

            if (!selectedFile) {
                showError("Önce bir görsel seç.");
                return;
            }


            const newWidth = Number(widthInput.value);
            const newHeight = Number(heightInput.value);


            if (
                !Number.isInteger(newWidth) ||
                !Number.isInteger(newHeight) ||
                newWidth <= 0 ||
                newHeight <= 0
            ) {
                showError(
                    "Genişlik ve yükseklik 1 veya daha büyük tam sayı olmalıdır."
                );

                return;
            }


            if (
                newWidth > 10000 ||
                newHeight > 10000
            ) {
                showError(
                    "Genişlik ve yükseklik 10000 pikselden büyük olamaz."
                );

                return;
            }


            resizeButton.disabled = true;
            resizeButton.textContent = "Boyutlandırılıyor...";


            const image = new Image();


            image.onload = () => {

                try {

                    const canvas =
                        document.createElement("canvas");

                    canvas.width = newWidth;
                    canvas.height = newHeight;


                    const context =
                        canvas.getContext("2d");


                    if (!context) {
                        throw new Error(
                            "Canvas desteklenmiyor."
                        );
                    }


                    context.drawImage(
                        image,
                        0,
                        0,
                        newWidth,
                        newHeight
                    );


                    canvas.toBlob(
                        (blob) => {

                            resizeButton.disabled = false;
                            resizeButton.textContent =
                                "Görseli Boyutlandır";


                            if (!blob) {

                                showError(
                                    "Görsel oluşturulamadı."
                                );

                                return;
                            }


                            clearDownloadUrl();

                            downloadUrl =
                                URL.createObjectURL(blob);


                            resultOriginal.textContent =
                                `${originalWidth} × ${originalHeight} px`;


                            resultNew.textContent =
                                `${newWidth} × ${newHeight} px`;


                            downloadButton.href =
                                downloadUrl;


                            result.style.display =
                                "block";

                        },
                        "image/jpeg",
                        0.92
                    );

                } catch (error) {

                    resizeButton.disabled = false;
                    resizeButton.textContent =
                        "Görseli Boyutlandır";

                    showError(
                        "Görsel boyutlandırılırken bir hata oluştu."
                    );
                }

            };


            image.onerror = () => {

                resizeButton.disabled = false;
                resizeButton.textContent =
                    "Görseli Boyutlandır";

                showError(
                    "Görsel yüklenemedi."
                );
            };


            image.src =
                URL.createObjectURL(selectedFile);

        });


        window.addEventListener("beforeunload", () => {

            if (previewUrl) {
                URL.revokeObjectURL(previewUrl);
            }

            if (downloadUrl) {
                URL.revokeObjectURL(downloadUrl);
            }

        });
    </script>

</body>
</html>
